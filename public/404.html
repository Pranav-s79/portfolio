<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pranav Senthilkumar</title>
    <!--
      GitHub Pages SPA fallback. Pages serves this file for any unknown path
      (e.g. a refresh on /projects). It rewrites the URL into a query the app
      can decode (see the inline script in index.html) and redirects to the
      app root, preserving the original path for the client-side router.
      pathSegmentsToKeep = 1 keeps the '/portfolio' project-site base segment.
    -->
    <script>
      (function () {
        var pathSegmentsToKeep = 1
        var l = window.location
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        )
      })()
    </script>
  </head>
  <body></body>
</html>
