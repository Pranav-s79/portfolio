<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F4EF" />
    <meta
      name="description"
      content="Pranav Senthilkumar — Electrical Engineering Honors student at Texas A&M. Robotics, chip design, AI/ML."
    />
    <title>Pranav Senthilkumar</title>

    <!-- Icons resolve through the deploy base (%BASE_URL% = '/' or '/portfolio/'). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pranav S" />

    <!-- Link previews (LinkedIn, Slack, iMessage) need absolute URLs. -->
    <link rel="canonical" href="https://pranavsen.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pranavsen.dev/" />
    <meta property="og:title" content="Pranav Senthilkumar" />
    <meta
      property="og:description"
      content="Electrical Engineering Honors student at Texas A&amp;M. Robotics, chip design, AI/ML."
    />
    <meta property="og:image" content="https://pranavsen.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pranav Senthilkumar · Electrical Engineering, Texas A&amp;M" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      GitHub Pages SPA fallback decoder. Restores the real path that 404.html
      encoded into the query string, before the React app mounts, so direct
      navigation / refresh of routes like /projects works with clean URLs.
    -->
    <script>
      (function () {
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

  </body>
