<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191C1D" media="(prefers-color-scheme: dark)" />

    <!--
      Theme before first paint, so there is never a flash of the wrong theme.
      A saved choice wins; otherwise follow the OS. src/theme.js takes over
      after the app mounts.
    -->
    <script>
      (function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        var root = document.documentElement
        root.setAttribute('data-theme', t)
        root.style.colorScheme = t
        // browser chrome follows the chosen theme, not just the OS
        var c = t === 'dark' ? '#191C1D' : '#F5F2EC'
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', c)
      })()
    </script>

    <title>Pranav Senthilkumar</title>
    <meta
      name="description"
      content="Electrical engineering student at Texas A&amp;M working on computer architecture, silicon design, embedded systems, and low-level software."
    />

    <!-- Icons resolve through the deploy base (%BASE_URL% = '/' or '/portfolio/'). -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Pranav S" />

    <!-- Link previews (LinkedIn, Slack, iMessage) need absolute URLs. -->
    <link rel="canonical" href="https://pranavsen.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pranav Senthilkumar" />
    <meta property="og:url" content="https://pranavsen.dev/" />
    <meta property="og:title" content="Pranav Senthilkumar" />
    <meta
      property="og:description"
      content="Computer architecture, silicon design, and embedded systems. RV32I processor, verification tooling, and embedded hardware."
    />
    <meta property="og:image" content="https://pranavsen.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pranav Senthilkumar · Computer architecture, silicon design, embedded systems" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      GitHub Pages SPA fallback decoder. Restores the real path that 404.html
      encoded into the query string, before the React app mounts, so direct
      navigation / refresh of routes like /projects works with clean URLs.
    -->
    <script>
      (function () {
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
